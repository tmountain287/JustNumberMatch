**DEPS**
}

// ----- Project-level plugin management (kept for compatibility) -----
buildscript {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        // Unity 6.2 권장: AGP 8.7.2 (Gradle 8.11 / JDK 17)
        classpath 'com.android.tools.build:gradle:8.7.2'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'Assets/GeneratedLocalRepo' }
    }
}

// ---------- Android Resolver Exclusions Start ----------
// Android Resolver Exclusions Start
android {
  packaging {
      exclude ('/lib/armeabi/*' + '*')
      exclude ('/lib/mips/*' + '*')
      exclude ('/lib/mips64/*' + '*')
      exclude ('/lib/x86/*' + '*')
      exclude ('/lib/x86_64/*' + '*')
  }
}
// Android Resolver Exclusions End
android {
    ndkVersion "**NDKVERSION**"       // Unity가 Hub/Preferences 값으로 치환
    packaging {
        // 불필요 ABI 제거(이미 사용 안 함)
        exclude ('/lib/armeabi/*' + '*')
        exclude ('/lib/mips/*' + '*')
        exclude ('/lib/mips64/*' + '*')
        exclude ('/lib/x86/*' + '*')
        exclude ('/lib/x86_64/*' + '*')
    }
}
// ---------- Android Resolver Exclusions End ----------

android {
    namespace "com.unity3d.player"

    // Unity가 자동 치환
    ndkPath "**NDKPATH**"
    compileSdk **APIVERSION**
    buildToolsVersion '**BUILDTOOLS**'

    // 실행 JDK는 17, 바이트코드 타깃은 11 권장(플러그인 호환성)
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
        coreLibraryDesugaringEnabled false
    }

    defaultConfig {
**DEFAULT_CONFIG_SETUP**
        minSdk **MINSDK**
        targetSdk **TARGETSDK**

        ndk {
            // Unity Build Settings > Player > Publishing Settings 의 값으로 치환
            debugSymbolLevel **DEBUGSYMBOLLEVEL**
            abiFilters **ABIFILTERS**   // 권장: arm64-v8a (16KB page 요구 대응)
        }

        versionCode **VERSIONCODE**
        versionName '**VERSIONNAME**'

        consumerProguardFiles 'proguard-unity.txt'**USER_PROGUARD**

        // (선택) 리소스 추가 경로 유지
        sourceSets {
            main {
                res.srcDirs += 'src/main/res'
            }
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    // 스트리밍 애셋 무압축 유지
    androidResources {
        noCompress = **BUILTIN_NOCOMPRESS** + unityStreamingAssets.tokenize(', ')
        ignoreAssetsPattern = "!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~"
    }

**PACKAGING**
}

// ----- IL2CPP/외부 소스 치환 영역 -----
**IL_CPP_BUILD_SETUP**
**SOURCE_BUILD_SETUP**
**EXTERNAL_SOURCES**
